version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.2
  aws-ecr: circleci/aws-ecr@10.0.0

workflows:
  build_and_push_image:
    jobs:
      - aws-ecr/build_and_push_image:
          context: aws-dev
          auth:
            - aws-cli/setup
          create_repo: true
          dockerfile: Dockerfile
          path: .
          repo: circleci-ecr-app-demo
          tag: "$CIRCLE_SHA1"
